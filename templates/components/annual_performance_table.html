<div>

<h2>Annual Performance</h2>

<table border="1" cellpadding="6" cellspacing="0" width="100%">

<tr>
<th align="left">Year</th>
<th width="20"></th>
<th align="right">Return</th>
<th align="right">Max Drawdown</th>
</tr>

{% for row in annual_table %}

<tr>

<td>{{ row.year }}</td>

<td align="center">
{% if row.positive %}
🟢
{% else %}
🔴
{% endif %}
</td>

<td align="right">
{{ "%+.2f"|format(row.return_pct) }}%
</td>

<td align="right">
{{ "%.2f"|format(row.max_eod_dd) }}%
</td>

</tr>

{% endfor %}

</table>

<p><small>Updated after each market close.</small></p>

</div>
