<div style="font-family:Arial,sans-serif; font-size:14px; margin:0; padding:0;">

<div style="display:flex; align-items:flex-start; gap:40px;">

    <div style="flex:0 0 auto;">

        {% if result.market_state == "settlement" %}

        <p style="font-size:1.3em;">
        ⏳ New Signal Zones available around 4:30 PM ET.
        </p>

        {% else %}

        <div style="font-size:15px; font-weight:bold; color:#555555;">
            SELL EXIT ZONE
        </div>

        <div style="font-size:28px; font-weight:bold; color:#222222; margin:12px 0;">
            {{ "%.2f"|format(result.exit_trigger) }}
        </div>

        <div>
            Sell Limit-on-Close
        </div>

        <div style="font-size:15px; font-weight:bold; color:#555555; margin-top:25px;">
            BUY ENTRY ZONE
        </div>

        <div style="font-size:28px; font-weight:bold; color:#222222; margin:12px 0;">
            {{ "%.2f"|format(result.entry_trigger) }}
        </div>

        <div>
            Buy Limit-on-Close
        </div>

        {% endif %}

    </div>

    <div style="width:140px;">

        <form method="get">

            <p>
                <label><strong>ETF</strong></label><br>
                <input
                    type="text"
                    name="etf"
                    value="{{ result.ticker }}"
                    size="6"
                    maxlength="8"
                    style="width:6ch;">
            </p>

            <p>
                <label><strong>Entry Lookback</strong></label><br>
                <input
                    type="number"
                    name="entry_lookback"
                    value="{{ result.entry_lookback }}"
                    style="width:4ch;">
            </p>

            <p>
                <label><strong>Exit Lookback</strong></label><br>
                <input
                    type="number"
                    name="exit_lookback"
                    value="{{ result.exit_lookback }}"
                    style="width:4ch;">
            </p>

            <button
                type="submit"
                style="width:110px;">
                Calculate
            </button>

        </form>

    </div>

</div>

</div>
