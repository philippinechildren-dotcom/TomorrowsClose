<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<style>
body{
    font-family:Arial,sans-serif;
    font-size:14px;
    margin:0;
    padding:15px;
}

/* PARAMETERS */

.parameters_container{
    display:flex;
    justify-content:flex-start;
    align-items:flex-start;
    gap:40px;
}

.parameters_left{
    display:grid;
    grid-template-columns:auto auto auto;
    gap:10px 12px;
    align-items:center;
}

.parameters_left label{
    font-weight:bold;
}

.parameters_left input,
.parameters_left select{
    font-size:14px;
    padding:4px;
}

.etf_input{
    width:8ch;
}

.small_input{
    width:5ch;
}

.time_period{
    width:15ch;
}

.column_header{
    font-weight:bold;
    text-align:center;
}

/* ACTION BUTTONS COLUMN (LEFT SIDE) */

.action_buttons_column {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
    margin-top: 15px;
}

.action_buttons_row {
    display: flex;
    gap: 8px;
    width: 100%;
}

/* Primary Centered/Wider Calculate Button */
.calc_btn_wide {
    width: 100%;
    padding: 8px 12px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    box-sizing: border-box;
}

/* Secondary Smaller Settings Buttons */
.settings_btn {
    flex: 1;
    padding: 5px 8px;
    font-size: 12px;
    font-weight: bold;
    color: #444;
    background-color: #f1f3f4;
    border: 1px solid #ccc;
    border-radius: 4px;
    cursor: pointer;
    text-align: center;
}

.settings_btn:hover {
    background-color: #e4e6e8;
}

.parameters_right{
    display:flex;
    flex-direction:column;
    gap:10px;
    min-width:210px;
}

.action_button{
    width:200px;
    padding:10px 16px;
    font-size:15px;
    font-weight:600;
    color:#ffffff;
    background:#3367D6;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

.action_button:hover{
    background:#2954B8;
}

.pricesolver_button{
    width:200px;
    padding:10px 16px;
    font-size:17px;
    font-weight:700;
    color:#ffffff;
    background:#34A853;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

.pricesolver_button:hover{
    background:#2D9147;
}

/* SMALL METRICS */

.metrics_container{
    margin-top:20px;
    margin-bottom:20px;
}

.metrics_table{
    border-collapse:collapse;
    width:auto;
    margin:0;
}

.metrics_table th{
    font-size:15px;
    font-weight:bold;
    color:#555555;
    padding:6px 26px;
    text-align:center;
    border-bottom:2px solid #cccccc;
    white-space:nowrap;
}

.metrics_table td{
    font-size:28px;
    font-weight:bold;
    color:#222222;
    padding:12px 26px;
    text-align:center;
    border-bottom:none;
}
</style>
</head>

<body>

<!-- SMALL METRICS -->

<div class="metrics_container">

<table class="metrics_table">

<thead>

<tr>

<th>UPI</th>
<th>CAGR</th>
<th>Max EOD DD</th>
<th>Ulcer Index</th>

</tr>

</thead>

<tbody>

<tr>

<td id="upi">-</td>
<td id="cagr">-</td>
<td id="max_eod_drawdown">-</td>
<td id="ulcer_index">-</td>

</tr>

</tbody>

</table>

</div>


<!-- PARAMETERS -->

<div class="parameters_container">

    <div>

        <div class="parameters_left">

            <div></div>
            <div class="column_header">Period</div>
            <div class="column_header">Threshold</div>

            <label>ETF</label>

            <input
                class="etf_input"
                type="text"
                value="{{ parameters.etf }}"
                style="grid-column:2 / 4;"
            >

            <label>RSI1</label>

            <input
                class="small_input rsi_1_period_input"
                type="number"
                value="{{ parameters.rsi_1_period }}"
            >

            <input
                class="small_input rsi_1_threshold_input"
                type="number"
                value="{{ parameters.rsi_1_threshold }}"
            >

            <label>RSI2</label>

            <input
                class="small_input rsi_2_period_input"
                type="number"
                value="{{ parameters.rsi_2_period }}"
            >

            <input
                class="small_input rsi_2_threshold_input"
                type="number"
                value="{{ parameters.rsi_2_threshold }}"
            >

            <label>RSI3</label>

            <input
                class="small_input rsi_3_period_input"
                type="number"
                value="{{ parameters.rsi_3_period }}"
            >

            <input
                class="small_input rsi_3_threshold_input"
                type="number"
                value="{{ parameters.rsi_3_threshold }}"
            >

            <label>RSI4</label>

            <input
                class="small_input rsi_4_period_input"
                type="number"
                value="{{ parameters.rsi_4_period }}"
            >

            <input
                class="small_input rsi_4_threshold_input"
                type="number"
                value="{{ parameters.rsi_4_threshold }}"
            >

            <label>RSI5</label>

            <input
                class="small_input rsi_5_period_input"
                type="number"
                value="{{ parameters.rsi_5_period }}"
            >

            <input
                class="small_input rsi_5_threshold_input"
                type="number"
                value="{{ parameters.rsi_5_threshold }}"
            >

            <label>Time Period</label>

            <select
                class="time_period"
                style="grid-column:2 / 4;"
            >

                <option value="1_year">1 Year</option>
                <option value="3_years">3 Years</option>
                <option value="5_years">5 Years</option>
                <option value="10_years">10 Years</option>
                <option value="maximum" selected>Maximum</option>

            </select>

        </div>

        <div class="action_buttons_column">

            <button id="calculate_button" class="calc_btn_wide">
                Calculate
            </button>

            <div class="action_buttons_row">
                <button id="save_settings_button" class="settings_btn" type="button">
                    Save Settings
                </button>
                <button id="restore_defaults_button" class="settings_btn" type="button">
                    Restore Defaults
                </button>
            </div>

        </div>

    </div>

    <div class="parameters_right">

        <button
            id="pricesolver_button"
            class="pricesolver_button">
            SIGNALS
        </button>

        <button
            id="full_metrics_button"
            class="action_button">
            Full Metrics
        </button>

        <button
            id="annual_returns_button"
            class="action_button">
            Annual Returns
        </button>

        <button
            id="performance_chart_button"
            class="action_button">
            Performance Chart
        </button>

    </div>

</div>


<script>

// Store baseline defaults supplied by Flask for restoration
const DEFAULT_SETTINGS = {
    etf: "{{ parameters.etf }}",
    rsi_1_period: "{{ parameters.rsi_1_period }}",
    rsi_1_threshold: "{{ parameters.rsi_1_threshold }}",
    rsi_2_period: "{{ parameters.rsi_2_period }}",
    rsi_2_threshold: "{{ parameters.rsi_2_threshold }}",
    rsi_3_period: "{{ parameters.rsi_3_period }}",
    rsi_3_threshold: "{{ parameters.rsi_3_threshold }}",
    rsi_4_period: "{{ parameters.rsi_4_period }}",
    rsi_4_threshold: "{{ parameters.rsi_4_threshold }}",
    rsi_5_period: "{{ parameters.rsi_5_period }}",
    rsi_5_threshold: "{{ parameters.rsi_5_threshold }}",
    period: "maximum"
};

function get_parameters(){

    return {
        strategy:"ulcershield",

        etf:
            document.querySelector(".etf_input").value,

        rsi_1_period:
            document.querySelector(".rsi_1_period_input").value,

        rsi_1_threshold:
            document.querySelector(".rsi_1_threshold_input").value,

        rsi_2_period:
            document.querySelector(".rsi_2_period_input").value,

        rsi_2_threshold:
            document.querySelector(".rsi_2_threshold_input").value,

        rsi_3_period:
            document.querySelector(".rsi_3_period_input").value,

        rsi_3_threshold:
            document.querySelector(".rsi_3_threshold_input").value,

        rsi_4_period:
            document.querySelector(".rsi_4_period_input").value,

        rsi_4_threshold:
            document.querySelector(".rsi_4_threshold_input").value,

        rsi_5_period:
            document.querySelector(".rsi_5_period_input").value,

        rsi_5_threshold:
            document.querySelector(".rsi_5_threshold_input").value,

        period:
            document.querySelector(".time_period").value
    };
}


function build_url(base_url){

    const parameters =
        get_parameters();

    const query =
        new URLSearchParams(parameters).toString();

    return base_url + "?" + query;
}


function load_metrics(){

    const parameters =
        get_parameters();

    const query =
        new URLSearchParams(parameters).toString();

    fetch(
        "/json/small-metrics?" + query
    )

    .then(response => response.json())

    .then(data => {

        const metrics = data.metrics;

        if (!metrics) {

            document.getElementById("upi").textContent = "-";
            document.getElementById("cagr").textContent = "-";
            document.getElementById("max_eod_drawdown").textContent = "-";
            document.getElementById("ulcer_index").textContent = "-";

            return;
        }

        document.getElementById("upi").textContent =
            metrics.ulcer_performance_index.toFixed(2);

        document.getElementById("cagr").textContent =
            (metrics.cagr * 100).toFixed(2) + "%";

        document.getElementById("max_eod_drawdown").textContent =
            (metrics.max_eod_drawdown * 100).toFixed(2) + "%";

        document.getElementById("ulcer_index").textContent =
            metrics.ulcer_index.toFixed(2);

    })

    .catch(() => {

        document.getElementById("upi").textContent = "-";
        document.getElementById("cagr").textContent = "-";
        document.getElementById("max_eod_drawdown").textContent = "-";
        document.getElementById("ulcer_index").textContent = "-";

    });
}


/*
    CACHE MANAGEMENT (localStorage)
*/

function save_settings() {
    const settings = {
        etf: document.querySelector(".etf_input").value,
        rsi_1_period: document.querySelector(".rsi_1_period_input").value,
        rsi_1_threshold: document.querySelector(".rsi_1_threshold_input").value,
        rsi_2_period: document.querySelector(".rsi_2_period_input").value,
        rsi_2_threshold: document.querySelector(".rsi_2_threshold_input").value,
        rsi_3_period: document.querySelector(".rsi_3_period_input").value,
        rsi_3_threshold: document.querySelector(".rsi_3_threshold_input").value,
        rsi_4_period: document.querySelector(".rsi_4_period_input").value,
        rsi_4_threshold: document.querySelector(".rsi_4_threshold_input").value,
        rsi_5_period: document.querySelector(".rsi_5_period_input").value,
        rsi_5_threshold: document.querySelector(".rsi_5_threshold_input").value,
        period: document.querySelector(".time_period").value
    };
    localStorage.setItem("rsi_ulcershield_saved_settings", JSON.stringify(settings));
    alert("Settings saved to browser cache!");
}

function restore_defaults() {
    document.querySelector(".etf_input").value = DEFAULT_SETTINGS.etf;
    document.querySelector(".rsi_1_period_input").value = DEFAULT_SETTINGS.rsi_1_period;
    document.querySelector(".rsi_1_threshold_input").value = DEFAULT_SETTINGS.rsi_1_threshold;
    document.querySelector(".rsi_2_period_input").value = DEFAULT_SETTINGS.rsi_2_period;
    document.querySelector(".rsi_2_threshold_input").value = DEFAULT_SETTINGS.rsi_2_threshold;
    document.querySelector(".rsi_3_period_input").value = DEFAULT_SETTINGS.rsi_3_period;
    document.querySelector(".rsi_3_threshold_input").value = DEFAULT_SETTINGS.rsi_3_threshold;
    document.querySelector(".rsi_4_period_input").value = DEFAULT_SETTINGS.rsi_4_period;
    document.querySelector(".rsi_4_threshold_input").value = DEFAULT_SETTINGS.rsi_4_threshold;
    document.querySelector(".rsi_5_period_input").value = DEFAULT_SETTINGS.rsi_5_period;
    document.querySelector(".rsi_5_threshold_input").value = DEFAULT_SETTINGS.rsi_5_threshold;
    document.querySelector(".time_period").value = DEFAULT_SETTINGS.period;
    
    localStorage.removeItem("rsi_ulcershield_saved_settings");
    load_metrics();
}

function load_saved_settings() {
    const saved = localStorage.getItem("rsi_ulcershield_saved_settings");
    if (saved) {
        try {
            const settings = JSON.parse(saved);
            if (settings.etf) document.querySelector(".etf_input").value = settings.etf;
            if (settings.rsi_1_period) document.querySelector(".rsi_1_period_input").value = settings.rsi_1_period;
            if (settings.rsi_1_threshold) document.querySelector(".rsi_1_threshold_input").value = settings.rsi_1_threshold;
            if (settings.rsi_2_period) document.querySelector(".rsi_2_period_input").value = settings.rsi_2_period;
            if (settings.rsi_2_threshold) document.querySelector(".rsi_2_threshold_input").value = settings.rsi_2_threshold;
            if (settings.rsi_3_period) document.querySelector(".rsi_3_period_input").value = settings.rsi_3_period;
            if (settings.rsi_3_threshold) document.querySelector(".rsi_3_threshold_input").value = settings.rsi_3_threshold;
            if (settings.rsi_4_period) document.querySelector(".rsi_4_period_input").value = settings.rsi_4_period;
            if (settings.rsi_4_threshold) document.querySelector(".rsi_4_threshold_input").value = settings.rsi_4_threshold;
            if (settings.rsi_5_period) document.querySelector(".rsi_5_period_input").value = settings.rsi_5_period;
            if (settings.rsi_5_threshold) document.querySelector(".rsi_5_threshold_input").value = settings.rsi_5_threshold;
            if (settings.period) document.querySelector(".time_period").value = settings.period;
        } catch (e) {
            console.error("Error loading saved settings:", e);
        }
    }
}


/*
    Initial dashboard load.
    Checks cache first, otherwise falls back to Flask defaults.
*/

load_saved_settings();
load_metrics();


/*
    EVENT LISTENERS
*/

document.getElementById("calculate_button").addEventListener(
    "click",
    function(){
        load_metrics();
    }
);

document.getElementById("save_settings_button").addEventListener(
    "click",
    save_settings
);

document.getElementById("restore_defaults_button").addEventListener(
    "click",
    restore_defaults
);


/*
    SIGNALS
*/

document.getElementById("pricesolver_button").addEventListener(
    "click",
    function(){

        window.top.location.href = build_url("https://tomorrowsclose.blogspot.com/p/rsi-ulcershield-pricesolver.html");

    }
);


/*
    FULL METRICS
*/

document.getElementById("full_metrics_button").addEventListener(
    "click",
    function(){

        window.open(
            build_url(
                "https://tomorrowsclose.blogspot.com/p/strategy-performance-metrics-and.html"
            ),
            "_blank"
        );

    }
);


/*
    ANNUAL RETURNS
*/

document.getElementById("annual_returns_button").addEventListener(
    "click",
    function(){

        window.open(
            build_url(
                "https://tomorrowsclose.blogspot.com/p/annual-strategy-returns-and-historical.html"
            ),
            "_blank"
        );

    }
);


/*
    PERFORMANCE CHART
*/

document.getElementById("performance_chart_button").addEventListener(
    "click",
    function(){

        window.open(
            build_url(
                "https://tomorrowsclose.blogspot.com/p/strategy-performance-chart-and.html"
            ),
            "_blank"
        );

    }
);

</script>

</body>
</html>
