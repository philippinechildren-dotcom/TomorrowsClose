<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">

<style>

body{
font-family:Arial,sans-serif;
font-size:14px;
margin:0;
padding:0;
}

table{
border-collapse:collapse;
width:auto;
margin:0;
}

th{
font-size:15px;
font-weight:bold;
color:#555555;
padding:6px 26px;
text-align:center;
border-bottom:2px solid #cccccc;
white-space:nowrap;
}

td{
font-size:28px;
font-weight:bold;
color:#222222;
padding:12px 26px;
text-align:center;
border-bottom:none;
}

</style>

</head>

<body>

<table>

<thead>

<tr>

<th>UPI</th>
<th>CAGR</th>
<th>Max EOD DD</th>
<th>Ulcer Index</th>

</tr>

</thead>

<tbody>

<tr>

<td id="upi"></td>
<td id="cagr"></td>
<td id="max_eod_drawdown"></td>
<td id="ulcer_index"></td>

</tr>

</tbody>

</table>

<script>

function load_metrics(){

fetch("/json/small-metrics")

.then(response=>response.json())

.then(data=>{

const metrics=data.metrics;

document.getElementById("upi").textContent =
metrics.ulcer_performance_index.toFixed(2);

document.getElementById("cagr").textContent =
(metrics.cagr*100).toFixed(2) + "%";

document.getElementById("max_eod_drawdown").textContent =
(metrics.max_eod_drawdown*100).toFixed(2) + "%";

document.getElementById("ulcer_index").textContent =
metrics.ulcer_index.toFixed(2);

});

}

load_metrics();

</script>

</body>

</html>
