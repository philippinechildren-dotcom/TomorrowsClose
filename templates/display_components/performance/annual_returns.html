<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">

<style>

body{
font-family:Arial,sans-serif;
margin:0;
padding:0;
font-size:14px;
}

table{
width:auto;
border-collapse:collapse;
}

th:nth-child(1),
td:nth-child(1){
width:70px;
}

th:nth-child(2),
td:nth-child(2){
width:110px;
}

th:nth-child(3),
td:nth-child(3){
width:110px;
}

th{
padding:8px;
text-align:center;
border-bottom:2px solid #cccccc;
font-weight:bold;
}

td{
padding:8px;
text-align:center;
border-bottom:1px solid #dddddd;
}

tbody tr:hover{
background:#f7f7f7;
}

.return-positive{
color:#2e7d32;
font-weight:bold;
}

.return-negative{
color:#c62828;
font-weight:bold;
}

.return-neutral{
color:#222222;
}

</style>

</head>

<body>

<table>

<thead>

<tr>

<th>Year</th>

<th>Return</th>

<th>Max EOD DD</th>

</tr>

</thead>

<tbody id="annual_returns_table">

</tbody>

</table>

<script>

function load_table(){

const params =
    new URLSearchParams(window.location.search);

fetch(
    "/json/annual-returns?" +
    params.toString()
)

.then(response=>response.json())

.then(data=>{

const table=document.getElementById(
"annual_returns_table"
);

table.innerHTML="";

data.annual_returns.forEach(row=>{

const return_percent =
    row.return * 100;

let return_class =
    "return-neutral";

if(return_percent > 1){
    return_class = "return-positive";
}else if(return_percent < -1){
    return_class = "return-negative";
}

const tr=document.createElement("tr");

tr.innerHTML=`

<td>${row.year}</td>

<td class="${return_class}">
${return_percent.toFixed(1)}%
</td>

<td>${(row.max_eod_drawdown*100).toFixed(1)}%</td>

`;

table.appendChild(tr);

});

});

}

load_table();

</script>

</body>

</html>
