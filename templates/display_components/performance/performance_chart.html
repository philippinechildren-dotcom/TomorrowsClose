<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:Arial,sans-serif;
margin:0;
padding:0;
}

.chart_container{
height:420px;
}

.summary{
display:flex;
justify-content:center;
gap:60px;
margin-top:12px;
font-size:15px;
}

.summary div{
text-align:center;
}

.summary_label{
font-weight:bold;
margin-bottom:4px;
}

</style>

</head>

<body>

<div class="controls">

</div>

<div class="chart_container">

<canvas id="performance_chart"></canvas>

</div>

<div class="summary">

<div>
<div class="summary_label">Strategy</div>
<div id="strategy_return">--</div>
</div>

<div>
<div class="summary_label">QQQ Buy & Hold</div>
<div id="benchmark_return">--</div>
</div>

<div>
<div class="summary_label">Difference</div>
<div id="difference_return">--</div>
</div>

</div>

<script>

const chart=new Chart(
document.getElementById("performance_chart"),
{

type:"line",

data:{
labels:[],
datasets:[
{
label:"Strategy",
data:[],
borderWidth:2,
pointRadius:0
},
{
label:"QQQ Buy & Hold",
data:[],
borderWidth:2,
pointRadius:0
}
]
},

options:{
responsive:true,
maintainAspectRatio:false,
interaction:{
mode:"index",
intersect:false
},
plugins:{
legend:{
display:false
}
},
scales:{
x:{
grid:{
display:false
}
},
y:{
title:{
display:true,
text:"Return (%)"
}
}
}
}

});

function load_chart(){

    const params =
        new URLSearchParams(window.location.search);

    fetch(
        "/json/performance-chart?" +
        params.toString()
    )

    .then(response=>response.json())

    .then(data=>{

        chart.data.labels =
            data.chart_data.map(row=>row.date);

        chart.data.datasets[0].label =
            data.strategy;

        chart.data.datasets[0].data =
            data.chart_data.map(row=>row.strategy);

        chart.data.datasets[1].label =
            data.benchmark;

        chart.data.datasets[1].data =
            data.chart_data.map(row=>row.benchmark);

        chart.update();

        const last =
            data.chart_data[data.chart_data.length-1];

        document.getElementById("strategy_return").innerHTML =
            last.strategy.toFixed(1)+"%";

        document.getElementById("benchmark_return").innerHTML =
            last.benchmark.toFixed(1)+"%";

        document.getElementById("difference_return").innerHTML =
            (last.strategy-last.benchmark).toFixed(1)+"%";

    });

}

load_chart();

function report_metric_height(){

    const height =
        document.documentElement.scrollHeight;

    window.parent.postMessage(
        {
            type: "metric_widget_height",
            height: height
        },
        "https://tomorrowsclose-1.onrender.com"
    );

}

window.addEventListener(
    "load",
    report_metric_height
);

setTimeout(
    report_metric_height,
    300
);

</script>

</body>
</html>
