<!DOCTYPE html>

<html>

<head>

<meta charset="utf-8">

<style>

body{
    font-family:Arial,sans-serif;
    font-size:14px;
    margin:0;
    padding:0;
}

.controls{
    margin-bottom:12px;
}

label{
    font-weight:bold;
}

select{
    padding:4px 8px;
    font-size:14px;
}

table{
    border-collapse:collapse;
    width:100%;
    font-size:14px;
}

th,
td{
    border:1px solid #cccccc;
    padding:6px 10px;
}

th{
    background:#eeeeee;
    cursor:pointer;
    user-select:none;
}

th:hover{
    background:#dddddd;
}

th:first-child,
td:first-child{
    text-align:left;
}

th:not(:first-child),
td:not(:first-child){
    text-align:right;
}

.strategy-link{
    color:#333333;
    text-decoration:underline;
}

.strategy-link:hover{
    color:#000000;
}

.sort-indicator{
    margin-left:4px;
    font-size:11px;
}

.footer{
    margin-top:10px;
    font-size:12px;
    color:#666666;
}

</style>

</head>

<body>

<div class="controls">

<label for="period">
Performance Period:
</label>

<select id="period">

<option value="1_month">1 Month</option>
<option value="3_month">3 Months</option>
<option value="6_month">6 Months</option>
<option value="ytd">YTD</option>
<option value="1_year">1 Year</option>
<option value="3_year">3 Years</option>
<option value="5_year">5 Years</option>
<option value="10_year">10 Years</option>
<option value="maximum" selected>Maximum</option>

</select>

</div>

<table id="rankings_table">

<colgroup>

<col style="width:180px">
<col style="width:65px">
<col style="width:65px">
<col style="width:65px">
<col style="width:65px">
<col style="width:65px">
<col style="width:65px">
<col style="width:65px">
<col style="width:65px">
<col style="width:65px">

</colgroup>

<thead>

<tr>

<th data-column="name">
Strategy
<span class="sort-indicator"></span>
</th>

<th data-column="ulcer_performance_index">
UPI
<span class="sort-indicator"></span>
</th>

<th data-column="cagr">
CAGR
<span class="sort-indicator"></span>
</th>

<th data-column="ulcer_index">
Ulcer Index
<span class="sort-indicator"></span>
</th>

<th data-column="max_eod_drawdown">
Max EOD DD
<span class="sort-indicator"></span>
</th>

<th data-column="max_closed_trade_drawdown">
Max Closed DD
<span class="sort-indicator"></span>
</th>

<th data-column="win_rate">
Win %
<span class="sort-indicator"></span>
</th>

<th data-column="profit_factor">
Profit Factor
<span class="sort-indicator"></span>
</th>

<th data-column="expectancy_percent">Expectancy<span class="sort-indicator"></span></th>
<th data-column="number_of_trades">Trades<span class="sort-indicator"></span></th>

</tr>

</thead>

<tbody></tbody>

</table>

<div class="footer" id="updated"></div>

<script>

let rankings_data={};

let current_period="maximum";

let current_sort_column="ulcer_performance_index";

let current_sort_direction="desc";


const strategy_links={

    "RSI Threshold":
        "https://www.tomorrowsclose.com/p/rsi-threshold-mean-reversion-strategy.html",

    "LowHigh":
        "https://www.tomorrowsclose.com/p/donchian-lowhigh-mean-reversion-system.html",

    "UlcerShield":
        "https://www.tomorrowsclose.com/p/rsi-ulcershield-mean-reversion-system.html"

};


function format_percent(value){

    if(value==="--"||value===null){
        return "--";
    }

    return (value*100).toFixed(1)+"%";

}


function format_number(value,digits=2){

    if(value==="--"||value===null){
        return "--";
    }

    return Number(value).toFixed(digits);

}

function format_trade_count(value){

    if(value === 0 || value === null){
        return "--";
    }

    return Number(value).toFixed(0);

}

function get_sort_value(row,column){

    if(column==="name"){
        return row.name||"";
    }

    const value=row[column];

    if(value===null||value===undefined){
        return -Infinity;
    }

    return Number(value);

}


function sort_rows(rows,column,direction){

    return [...rows].sort(function(a,b){

        const value_a=get_sort_value(a,column);

        const value_b=get_sort_value(b,column);


        if(typeof value_a==="string"){

            return direction==="asc"
                ? value_a.localeCompare(value_b)
                : value_b.localeCompare(value_a);

        }


        return direction==="asc"
            ? value_a-value_b
            : value_b-value_a;

    });

}


function strategy_cell(name){

    if(strategy_links[name]){

        return `
<a
    class="strategy-link"
    href="${strategy_links[name]}"
>${name}</a>
`;

    }

    return name;

}


function update_sort_indicators(){

    document
        .querySelectorAll("#rankings_table th")
        .forEach(function(header){

            const indicator=
                header.querySelector(".sort-indicator");


            if(!indicator){
                return;
            }


            const column=
                header.dataset.column;


            if(column===current_sort_column){

                indicator.textContent=
                    current_sort_direction==="asc"
                    ?"▲"
                    :"▼";

            }else{

                indicator.textContent="";

            }

        });

}


function load_table(period){

    current_period=period;


    const tbody=
        document.querySelector(
            "#rankings_table tbody"
        );

    tbody.innerHTML="";


    let rows=
        rankings_data[period]||[];


    rows=sort_rows(
        rows,
        current_sort_column,
        current_sort_direction
    );


    rows.forEach(function(row){

        tbody.innerHTML+=`

<tr>

<td>
${strategy_cell(row.name)}
</td>

<td>
${format_number(row.ulcer_performance_index)}
</td>

<td>
${format_percent(row.cagr)}
</td>

<td>
${format_number(row.ulcer_index)}
</td>

<td>
${format_percent(row.max_eod_drawdown)}
</td>

<td>
${format_percent(row.max_closed_trade_drawdown)}
</td>

<td>
${format_percent(row.win_rate)}
</td>

<td>
${format_number(row.profit_factor)}
</td>

<td>
${format_percent(row.expectancy_percent)}
</td>

<td>${format_trade_count(row.number_of_trades)}</td>

</tr>

`;

    });


    update_sort_indicators();

}


fetch("/json/rankings")

.then(response=>response.json())

.then(data=>{

    rankings_data=data;

    document.getElementById("updated").innerHTML=
        "Updated: "+data.updated;

    load_table(current_period);

});


document
    .getElementById("period")
    .addEventListener(
        "change",
        function(){

            load_table(this.value);

        }
    );


document
    .querySelectorAll("#rankings_table th")
    .forEach(function(header){

        header.addEventListener(
            "click",
            function(){

                const column=
                    this.dataset.column;


                if(column===current_sort_column){

                    current_sort_direction=
                        current_sort_direction==="asc"
                        ?"desc"
                        :"asc";

                }else{

                    current_sort_column=column;

                    current_sort_direction=
                        column==="name"
                        ?"asc"
                        :"desc";

                }


                load_table(current_period);

            }
        );

    });

</script>

</body>

</html>
